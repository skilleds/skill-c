# CI de C (schematize-c). Copie para .github/workflows/ci.yml e ajuste o alvo.
# Actions pinadas por SHA completo; troque por bump deliberado (o comentario diz a versao).
name: ci
on:
  workflow_dispatch:
  push:
    tags: ["hml-*", "v*"]

# Piso 27: CI remoto NAO roda por commit nem por PR. O gate por commit e LOCAL (scripts/pre-commit);
# este workflow roda so antes de promover a hml (tag hml-*), em release (tag v*) ou sob pedido (dispatch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  c:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ferramentas
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy clang-format cmake
      - name: Format (clang-format)
        run: git ls-files '*.c' '*.h' | xargs -r clang-format --dry-run --Werror
      - name: Gate da skill (flags, sanitizers, funções proibidas)
        run: bash .claude/skills/schematize-c/scripts/check-c.sh .
      - name: compile_commands.json
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Lint (clang-tidy)
        run: git ls-files '*.c' | xargs -r clang-tidy -p build --warnings-as-errors='*'
      - name: Build + testes sanitizados (ASan+UBSan, sem recover)
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -S . -B build -DCMAKE_C_STANDARD=17 -DCMAKE_C_STANDARD_REQUIRED=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -Wconversion -Wshadow -Wformat=2 -Wvla -Wcast-qual -Wstrict-prototypes -D_FORTIFY_SOURCE=3 -fstack-protector-strong -fPIE -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-pie -Wl,-z,relro,-z,now,-z,noexecstack"
          cmake --build build
          ctest --test-dir build --output-on-failure

  tsan:
    # TSan e ASan não convivem: job à parte (piso.md secao 2 e 7). Só faz sentido onde há thread.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build + testes com ThreadSanitizer
        env:
          CC: clang
        run: |
          cmake -S . -B build-tsan -DCMAKE_C_STANDARD=17 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer"
          cmake --build build-tsan
          ctest --test-dir build-tsan --output-on-failure

  fuzz:
    # Entrada externa => fuzzing com corpus versionado (piso.md secao 6). Roda se existir tests/fuzz.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: libFuzzer (tempo curto, corpus em tests/corpus)
        env:
          CC: clang
        run: |
          [ -d tests/fuzz ] || { echo "sem tests/fuzz — job pulado (parser com entrada externa exige harness)"; exit 0; }
          for f in tests/fuzz/*.c; do
            clang -g -O1 -fsanitize=fuzzer,address,undefined "$f" src/*.c -Isrc -o fuzz.bin
            ./fuzz.bin -max_total_time=60 tests/corpus
          done
